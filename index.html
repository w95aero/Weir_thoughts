<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clippy.exe</title>

    <style>

        /* =========================================
           WINDOWS 95 — GLOBAL
           ========================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #008080;
            font-family:
                "MS Sans Serif",
                "Microsoft Sans Serif",
                Arial,
                sans-serif;

            color: #000;
            overflow-x: hidden;
        }


        /* =========================================
           DESKTOP
           ========================================= */

        .desktop {
            min-height: 100vh;
            padding: 35px 20px 70px;

            display: flex;
            justify-content: center;
            align-items: flex-start;
        }


        /* =========================================
           MAIN WINDOWS 95 WINDOW
           ========================================= */

        .window {
            width: 100%;
            max-width: 650px;

            background: #c0c0c0;

            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #000000;
            border-bottom: 2px solid #000000;

            box-shadow:
                2px 2px 0 #000000,
                inset 1px 1px 0 #dfdfdf,
                inset -1px -1px 0 #808080;
        }


        /* =========================================
           TITLE BAR
           ========================================= */

        .title-bar {
            height: 30px;

            margin: 3px 3px 0;

            padding: 3px 4px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: #000080;
            color: #ffffff;

            font-weight: bold;
            font-size: 14px;

            user-select: none;
        }


        .title-left {
            display: flex;
            align-items: center;
            gap: 7px;

            min-width: 0;
        }


        .title-icon {
            width: 18px;
            height: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 14px;
        }


        .title-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }


        /* =========================================
           WINDOW BUTTONS
           ========================================= */

        .window-buttons {
            display: flex;
            gap: 2px;
        }


        .window-button {
            width: 20px;
            height: 20px;

            background: #c0c0c0;

            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #000000;
            border-bottom: 2px solid #000000;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #000000;

            font-family: Arial, sans-serif;
            font-size: 12px;
            font-weight: bold;

            line-height: 1;

            cursor: default;
        }


        .window-button:active {
            border-top: 2px solid #000000;
            border-left: 2px solid #000000;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;

            padding-top: 2px;
            padding-left: 2px;
        }


        /* =========================================
           WINDOW CONTENT
           ========================================= */

        .window-content {
            margin: 3px;

            background: #ffffff;

            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;

            min-height: 650px;
        }


        /* =========================================
           CLIPPY HERO
           ========================================= */

        .hero {
            padding: 45px 25px 35px;

            text-align: center;

            background: #ffffff;
        }


        .clippy-container {
            width: 230px;
            height: 230px;

            margin: 0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        .clippy-image {
            max-width: 100%;
            max-height: 100%;

            object-fit: contain;

            image-rendering: auto;
        }


        .name {
            font-size: 32px;
            font-weight: bold;

            letter-spacing: 1px;

            margin-bottom: 12px;
        }


        .description {
            max-width: 430px;

            margin: 0 auto;

            font-size: 15px;
            line-height: 1.5;
        }


        /* =========================================
           SOCIAL CARDS
           ========================================= */

        .links {
            padding: 10px 25px 35px;

            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 15px;
        }


        .social-card {
            min-height: 90px;

            background: #c0c0c0;

            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #000000;
            border-bottom: 2px solid #000000;

            text-decoration: none;
            color: #000000;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 7px;

            cursor: pointer;

            transition: none;
        }


        .social-card:hover {
            background: #d4d4d4;
        }


        .social-card:active {
            border-top: 2px solid #000000;
            border-left: 2px solid #000000;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;

            padding-top: 2px;
            padding-left: 2px;
        }


        .social-icon {
            font-size: 25px;
            line-height: 1;
        }


        .social-title {
            font-size: 15px;
            font-weight: bold;
        }


        .social-subtitle {
            font-size: 11px;
        }


        /* =========================================
           STATUS BAR
           ========================================= */

        .status-bar {
            margin: 0 3px 3px;

            height: 27px;

            display: flex;
            align-items: center;

            padding: 3px 6px;

            background: #c0c0c0;

            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;

            font-size: 12px;
        }


        /* =========================================
           TASKBAR
           ========================================= */

        .taskbar {
            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            height: 42px;

            background: #c0c0c0;

            border-top: 2px solid #ffffff;

            display: flex;
            align-items: center;

            padding: 3px 5px;

            z-index: 1000;
        }


        .start-button {
            height: 32px;

            min-width: 82px;

            padding: 0 8px;

            background: #c0c0c0;

            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #000000;
            border-bottom: 2px solid #000000;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 7px;

            font-family: inherit;
            font-size: 14px;
            font-weight: bold;

            cursor: default;
        }


        .start-button:active {
            border-top: 2px solid #000000;
            border-left: 2px solid #000000;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;

            padding-top: 2px;
            padding-left: 10px;
        }


        .start-logo {
            font-size: 18px;
        }


        .taskbar-divider {
            width: 2px;
            height: 30px;

            margin-left: 7px;
            margin-right: 7px;

            border-left: 2px solid #808080;
            border-right: 1px solid #ffffff;
        }


        .taskbar-item {
            height: 32px;

            min-width: 130px;

            padding: 0 10px;

            background: #c0c0c0;

            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;

            display: flex;
            align-items: center;

            gap: 7px;

            font-size: 12px;
            font-weight: bold;
        }


        .clock {
            margin-left: auto;

            height: 32px;

            min-width: 75px;

            padding: 0 8px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;

            font-size: 12px;
        }


        /* =========================================
           RESPONSIVE
           ========================================= */

        @media (max-width: 600px) {

            .desktop {
                padding: 15px 8px 60px;
            }


            .window-content {
                min-height: 600px;
            }


            .hero {
                padding: 35px 15px 25px;
            }


            .clippy-container {
                width: 190px;
                height: 190px;
            }


            .name {
                font-size: 27px;
            }


            .description {
                font-size: 13px;
            }


            .links {
                grid-template-columns: 1fr;

                padding-left: 15px;
                padding-right: 15px;
            }


            .taskbar-item {
                min-width: 0;
                flex: 1;
            }

        }

    </style>
</head>


<body>

    <div class="desktop">

        <main class="window">

            <!-- TITLE BAR -->
            <div class="title-bar">

                <div class="title-left">

                    <div class="title-icon">
                        📎
                    </div>

                    <div class="title-text">
                        Clippy.exe
                    </div>

                </div>


                <div class="window-buttons">

                    <div class="window-button">
                        _
                    </div>

                    <div class="window-button">
                        □
                    </div>

                    <div class="window-button">
                        ×
                    </div>

                </div>

            </div>


            <!-- CONTENT -->
            <div class="window-content">

                <section class="hero">

                    <div class="clippy-container">

                        <img
                            class="clippy-image"
                            src="images/clippy.png"
                            alt="Clippy"
                        >

                    </div>


                    <h1 class="name">
                        CLIPPY
                    </h1>


                    <p class="description">
                        Your friendly paperclip assistant.
                        <br>
                        Always ready to help.
                    </p>

                </section>


                <!-- SOCIAL LINKS -->
                <section class="links">

                    <a
                        class="social-card"
                        href="#"
                        target="_blank"
                        rel="noopener"
                    >

                        <div class="social-icon">
                            ◎
                        </div>

                        <div class="social-title">
                            Instagram
                        </div>

                        <div class="social-subtitle">
                            Visit Instagram
                        </div>

                    </a>


                    <a
                        class="social-card"
                        href="#"
                        target="_blank"
                        rel="noopener"
                    >

                        <div class="social-icon">
                            ✈
                        </div>

                        <div class="social-title">
                            Telegram
                        </div>

                        <div class="social-subtitle">
                            Visit Telegram
                        </div>

                    </a>

                </section>

            </div>


            <!-- STATUS BAR -->
            <div class="status-bar">

                Ready.

            </div>

        </main>

    </div>


    <!-- WINDOWS 95 TASKBAR -->

    <div class="taskbar">

        <button class="start-button">

            <span class="start-logo">
                🪟
            </span>

            <span>
                Start
            </span>

        </button>


        <div class="taskbar-divider"></div>


        <div class="taskbar-item">

            <span>
                📎
            </span>

            <span>
                Clippy.exe
            </span>

        </div>


        <div class="clock" id="clock">
            12:00 PM
        </div>

    </div>


    <script>

        /* =========================================
           WINDOWS 95 CLOCK
           ========================================= */

        function updateClock() {

            const clock =
                document.getElementById("clock");

            const now =
                new Date();

            let hours =
                now.getHours();

            const minutes =
                String(now.getMinutes())
                    .padStart(2, "0");

            const seconds =
                String(now.getSeconds())
                    .padStart(2, "0");

            const period =
                hours >= 12 ? "PM" : "AM";

            hours =
                hours % 12 || 12;

            clock.textContent =
                `${hours}:${minutes}:${seconds} ${period}`;
        }


        updateClock();

        setInterval(
            updateClock,
            1000
        );

    </script>

</body>
</html>
