/* =========================================================
   WEIR_THOUGHTS
   CLIPPY PROFILE
   WINDOWS 95 / WINDOWS XP AESTHETIC
   ========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    background: #008080;
    color: #000;
    font-family:
        "MS Sans Serif",
        "Microsoft Sans Serif",
        Arial,
        sans-serif;
    overflow: hidden;
}


/* =========================================================
   DESKTOP
   ========================================================= */

#app {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
}


/* =========================================================
   BLISS
   ========================================================= */

.background {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
}

.background img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
}

.background::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            rgba(0,0,0,.04),
            rgba(0,0,0,.08)
        );
    pointer-events: none;
}


/* =========================================================
   MAIN AREA
   ========================================================= */

.main {
    position: relative;
    z-index: 5;

    width: 100%;
    height: 100%;

    overflow-y: auto;
    overflow-x: hidden;

    padding:
        40px
        20px
        90px;
}


/* =========================================================
   WINDOW
   ========================================================= */

.window {
    width: min(680px, 96%);
    margin: 0 auto;

    background: #c0c0c0;

    border-top: 2px solid #fff;
    border-left: 2px solid #fff;
    border-right: 2px solid #000;
    border-bottom: 2px solid #000;

    box-shadow:
        3px 3px 0 #000;
}


/* =========================================================
   TITLE BAR
   ========================================================= */

.titlebar {
    height: 30px;

    margin: 3px 3px 0;

    background: #000080;

    color: white;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding:
        2px
        3px;

    font-size: 13px;
    font-weight: bold;

    user-select: none;
}

.title-left {
    display: flex;
    align-items: center;
    gap: 7px;

    overflow: hidden;
}

.title-icon {
    width: 18px;
    height: 18px;

    display: flex;
    align-items: center;
    justify-content: center;
}

.title-text {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}


/* =========================================================
   WINDOW CONTROLS
   ========================================================= */

.controls {
    display: flex;
    gap: 2px;
}

.control {
    width: 21px;
    height: 21px;

    background: #c0c0c0;

    color: #000;

    display: flex;
    align-items: center;
    justify-content: center;

    border-top: 2px solid #fff;
    border-left: 2px solid #fff;
    border-right: 2px solid #000;
    border-bottom: 2px solid #000;

    font-family: Arial, sans-serif;
    font-size: 12px;
    font-weight: bold;
}


/* =========================================================
   WINDOW BODY
   ========================================================= */

.window-body {
    margin: 3px;

    background: #fff;

    border-top: 2px solid #808080;
    border-left: 2px solid #808080;
    border-right: 2px solid #fff;
    border-bottom: 2px solid #fff;

    padding: 35px 25px 30px;
}


/* =========================================================
   PROFILE
   ========================================================= */

.profile {
    text-align: center;
}


/* =========================================================
   CLIPPY
   ========================================================= */

.clippy-wrap {
    width: 230px;
    height: 230px;

    margin: 0 auto 18px;

    display: flex;
    align-items: center;
    justify-content: center;

    animation:
        breathe
        4s
        ease-in-out
        infinite;

    filter:
        drop-shadow(
            0 12px 8px
            rgba(0,0,0,.25)
        );
}

.clippy {
    width: 100%;
    height: 100%;

    overflow: visible;
}


/* =========================================================
   BREATHING
   ========================================================= */

@keyframes breathe {

    0% {
        transform:
            translateY(0)
            scale(1);
    }

    25% {
        transform:
            translateY(-5px)
            scale(1.012);
    }

    50% {
        transform:
            translateY(-9px)
            scale(1.025);
    }

    75% {
        transform:
            translateY(-5px)
            scale(1.012);
    }

    100% {
        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================================================
   NAME
   ========================================================= */

.name {
    font-size: 30px;
    font-weight: bold;

    margin-bottom: 12px;

    color: #000;

/* =========================================================

/* =========================================================

/* =========================================================

   ========================================================= */

.card {

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 7px;

    border-left: 2px solid #fff;
    border-right: 2px solid #000;
    border-bottom: 2px solid #000;

    box-shadow:
        1px 1px 0 #000;

    transition: none;
}

.card:hover {
    background: #d4d4d4;
}

.card:active {
    border-top: 2px solid #000;
    border-left: 2px solid #000;
    border-right: 2px solid #fff;
    border-bottom: 2px solid #fff;

    box-shadow: none;

/* =========================================================

.taskbar {

/* =========================================================

/* =========================================================

<script>

/* =========================================================
   WINDOWS 95 CLOCK
   ========================================================= */

function updateClock() {

    const clock =
        document.getElementById("clock");

    const now =
        new Date();

    let hours =
        now.getHours();

    const minutes =
        String(
            now.getMinutes()
        ).padStart(
            2,
            "0"
        );

    const seconds =
        String(
            now.getSeconds()
        ).padStart(
            2,
            "0"
        );

    const period =
        hours >= 12
            ? "PM"
            : "AM";

    hours =
        hours % 12 || 12;

    clock.textContent =
        hours +
        ":" +
        minutes +
        ":" +
        seconds +
        " " +
        period;
}


/* =========================================================
   START CLOCK
   ========================================================= */

updateClock();

setInterval(
    updateClock,
    1000
);


/* =========================================================

</script>
